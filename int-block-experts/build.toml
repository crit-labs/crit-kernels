[general]
name = "int-block-experts"
license = "Apache-2.0"
backends = [
  "cuda",
]
version = 1
edition = 6

[general.hub]
repo-id = "crit-labs/int-block-experts"

[torch]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]

[kernel.int_block]
language = "cpp-cuda"
depends = ["torch"]
cuda-capabilities = ["8.0", "8.6", "8.9", "9.0", "10.0", "12.0"]
src = [
  "int_block_cuda/binding.cu",
  "int_block_cuda/int_block.cu",
  "int_block_cuda/int_block.h",
]
