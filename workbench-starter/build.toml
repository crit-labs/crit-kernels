[general]
name = "workbench-starter"
license = "Apache-2.0"
backends = [
  "cuda",
]
version = 1
edition = 6

[general.hub]
repo-id = "crit-labs/workbench-starter"

[torch]
src = [
  "torch-ext/torch_binding.cpp",
  "torch-ext/torch_binding.h",
]

[kernel.workbench_starter]
language = "cpp-cuda"
depends = ["torch"]
cuda-capabilities = ["8.0", "8.6", "8.9", "9.0", "10.0", "12.0"]
src = [
  "workbench_starter_cuda/starter.cu",
]
